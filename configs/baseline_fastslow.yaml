extends: baseline.yaml

experiment:
  name: baseline_fastslow

postprocess:
  detector_mode: dual_ema
  fast_ema_half_life_seconds: 3
  slow_ema_half_life_seconds: 18
  fast_high_threshold: 0.3
  slow_high_threshold: 0.2
  exit_threshold_ratio: 0.5
  off_duration_seconds: 12

postprocess_search:
  detector_mode: dual_ema
  boundary_model_version: derivative_v1
  require_interior_threshold: true
  workers: 16
  stage1_keep: 20
  fast_ema_half_life_seconds: [1.5, 3, 6]
  slow_ema_half_life_seconds: [12, 24, 48]
  fast_high_threshold: [0.03, 0.1, 0.25, 0.6]
  slow_high_threshold: [0.02, 0.08, 0.2, 0.5]
  exit_threshold_ratio: [0.25, 0.5, 0.75]
  off_duration_seconds: [6, 18, 60]
  minimum_event_seconds: [9, 15, 30, 60]
  merge_gap_seconds: [15, 30, 60, 120]
  boundary_lookback_seconds: [15, 30, 60, 120]

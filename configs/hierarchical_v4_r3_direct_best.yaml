extends: hierarchical_v4_r3_d2c.yaml

experiment:
  name: hierarchical_v4_r3_direct_best
  ablation_id: R3-DIRECT
  variant: time_constrained_direct_d2c_ppg_semimarkov
  time_constrained_direct: true

model:
  use_ppg: true

training:
  batch_size: 8
  gradient_accumulation: 4
  inference_batch_size: 8
  validation_every_epochs: 2
  learning_rate: 0.00015
  warmup_fraction: 0.10
  gradient_clip_norm: 5.0

decoder:
  use_semi_markov: true

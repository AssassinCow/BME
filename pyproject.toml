[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bme-eating-detection"
version = "0.1.0"
description = "Reproducible baselines and dyadic temporal pyramid models for the 2026 BME eating-detection competition"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<21",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "xgboost>=2.1,<4",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

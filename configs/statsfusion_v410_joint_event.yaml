project:
  seed: 2026
  data_root_env: BME_DATA_ROOT
  output_root_env: BME_OUTPUT_ROOT
  artifact_schema_version: v410
  canonical_schema_version: v4
  input_artifact_schema_version: v2
experiment:
  name: statsfusion_v410_joint_event
  code_version: v4.10
  protocol_version: statsfusion-joint-event-v1
model:
  architecture: statsfusion_joint_event
  hidden_dim: 64
  motion_block_seconds: 3
  ppg_block_seconds: 15
  motion_embedding_dim: 64
  ppg_embedding_dim: 48
  statistics_dim: 32
  motion_dilations: [1, 2, 4, 8, 16, 32]
  ppg_dilations: [1, 2, 4, 8]
  statistics_dilations: [1, 2, 4, 8]
  long_dilations: [1, 2, 4, 8, 16, 32]
  long_pool_factor: 5
  dropout: 0.1
  gate_initial_bias: -2.0
  use_motion: true
  use_ppg: true
  use_statistics: true
  use_long_context: true
  separate_motion_branches: true
  use_invariant_motion_branch: true
  use_quality_conditioned_fusion: true
  use_local_cross_scale_attention: true
  local_attention_window_steps: 8
  use_mixstyle: false
  use_proposal_head: false
  future_context_seconds: 0
  stable_feature_columns:
    - local_acc_y_mean
    - local_acc_z_zero_crossing_rate
    - local_gyro_z_mad
    - local_acc_mag_std
    - local_gyro_z_zero_crossing_rate
    - local_acc_mag_iqr
    - local_acc_mag_jerk_rms
    - local_gyro_y_mad
    - local_acc_y_median
    - local_ppg_valid_fraction
    - local_gyro_mag_jerk_p95
    - local_acc_x_median
sequence:
  supervised_steps: 256
  short_receptive_field_steps: 127
  long_receptive_field_tokens: 127
  long_pool_factor: 5
  step_seconds: 3
training:
  device: cuda
  amp_dtype: bfloat16
  seeds: [2026]
  num_workers: 10
  loader_prefetch_factor: 1
  session_reader_cache_size: 1
  accumulate_sessions: 4
  max_epochs: 32
  encoder_learning_rate: 0.0001
  head_learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 5.0
  clipping_abort_fraction: 0.50
  clipping_promotion_fraction: 0.20
  checkpoint_min_epoch: 8
  validation_every_epochs: 2
  patience_checks: 3
  f1_min_delta: 0.003
  selector_fraction: 0.35
  partitions: 3
  candidates_per_chunk: 8
  sample_composition:
    positive: 0.30
    near_miss: 0.25
    hard_false_positive: 0.30
    random_background: 0.15
  ppg_modality_dropout: 0.20
  gyro_modality_dropout: 0.10
  rotation_augmentation_probability: 0.20
  gradient_diagnostics_every_chunks: 32
loss:
  state: 0.5
  proposal: 1.0
  transitions: 0.1
  event: 1.0
  quality: 0.5
  boundary: 0.1
  smooth: 0.02
  contrastive: 0.003
  quality_beta: 2.0
  contrastive_temperature: 0.1
  contrastive_max_pairs: 128
decoder:
  high_threshold: 0.10
  ema_half_life_seconds: 6
  maximum_candidates_per_hour: 20
  gap_merge_seconds: 15
  commit_buffer_seconds: 30
  use_transition_candidates: false
  jitter_seconds: [-30, -15, 0, 15, 30]
  maximum_variants_per_event: 17
  backtrack_seconds: 600
  start_expansion_seconds: 600
  quotas:
    proposal: 0.20
    short: 0.15
    expansion: 0.15
boundary:
  sigma_seconds: 9
  maximum_start_range_seconds: 900
  maximum_end_range_seconds: 30
  minimum_positive_events: 60
  minimum_candidate_recall: 0.70
  entropy_thresholds: [0.55, 0.65, 0.75]
search:
  high_thresholds: [0.06, 0.10, 0.20]
  budgets: [10, 20, 30]
  nms_ious: [0.3, 0.5, 0.7]
  gap_seconds: [0, 15, 30]
  acceptance_min: 0.01
  acceptance_max: 0.99
  acceptance_step: 0.01
calibration:
  maximum_ece: 0.10
  bins: 15
gates:
  minimum_f1: 0.5475
  maximum_fp_per_hour: 0.0609237
  minimum_candidate_covered: 125
  expected_truth_count: 161
  minimum_fold_candidate_recall: 0.70
  maximum_hand_recall_drop: 0.02
  minimum_bootstrap_advantage: 0.80
  bootstrap_replicates: 1000
  maximum_stress_f1_drop: 0.03
  boundary_minimum_mae_improvement: 0.10
  boundary_maximum_f1_drop: 0.005
  boundary_maximum_tp_to_fp_rate: 0.01
  boundary_maximum_clipping_rate: 0.05
resources:
  maximum_gpu_gb: 10.5
  cpu_threads: 2

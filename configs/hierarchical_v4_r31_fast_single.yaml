extends: hierarchical_v4_r31_direct_best.yaml

experiment:
  name: hierarchical_v4_r31_fast_single
  variant: time_constrained_single_holdout_d2c_ppg_semimarkov
  time_constrained_single_holdout: true

training:
  fixed_state_epochs: 5
  single_holdout_fraction: 0.35

hierarchical:
  state_crossfit_mode: single_holdout
  downstream_mode: state_only

decoder:
  high_threshold: 0.20
  low_threshold: 0.05
  ema_half_life_seconds: 12
  gap_merge_seconds: 60
  transition_threshold: 0.20
  semi_markov_duration_weight: 1.0

decoder_search:
  high_threshold: [0.20]
  low_threshold: [0.05]
  ema_half_life_seconds: [12]
  gap_merge_seconds: [60]
  transition_threshold: [0.20]
  semi_markov_duration_weight: [1.0]

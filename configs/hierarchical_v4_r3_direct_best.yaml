extends: hierarchical_v4_r3_d2c.yaml

experiment:
  name: hierarchical_v4_r3_direct_best
  ablation_id: R3-DIRECT
  variant: time_constrained_direct_d2c_ppg_semimarkov
  time_constrained_direct: true

model:
  use_ppg: true

training:
  batch_size: 8
  gradient_accumulation: 4
  steps_per_epoch: 2500
  inference_batch_size: 8
  validation_every_epochs: 1
  selector_decoder_search: fixed
  learning_rate: 0.00015
  warmup_fraction: 0.10
  gradient_clip_norm: 5.0

decoder:
  use_semi_markov: true

decoder_search:
  high_threshold: [0.15, 0.20, 0.25]
  low_threshold: [0.05, 0.10]
  ema_half_life_seconds: [6, 12]
  gap_merge_seconds: [30, 60]
  transition_threshold: [0.20, 0.30]
  semi_markov_duration_weight: [1.0]

final_training:
  state_seeds: [2026]
